# Tooling configuration only. Runtime/test dependencies are declared in
# requirements.txt (see README); ruff and pytest are configured here.

# The [project] table exists only so uv honors `managed = false` (uv ignores
# it without one). Tools that start with `uv run` from this folder, such as
# Claude Code plugin servers, would otherwise rebuild .venv from the empty
# dependency list and delete every installed package.
[project]
name = "chess-coach"
version = "0"
requires-python = ">=3.12"

[tool.uv]
managed = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# ruff defaults (E4/E7/E9, F) plus import sorting.
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
